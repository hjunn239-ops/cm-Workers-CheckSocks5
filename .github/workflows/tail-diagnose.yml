name: Diagnose edgetunnel (tail)

on:
  workflow_dispatch:

jobs:
  tail:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install wrangler
        run: npm install -g wrangler@4
      - name: Tail logs and probe the worker
        run: |
          (timeout 50 wrangler tail v20251104 --format pretty > tail.log 2>&1 &)
          sleep 10
          for p in / /login /version; do
            echo "probe $p:"
            curl -s -o /dev/null -w "%{http_code}\n" "https://v20251104.hjunn239.workers.dev$p" || true
            sleep 3
          done
          sleep 25
          echo '================ TAIL LOG ================'
          cat tail.log
